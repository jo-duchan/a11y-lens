name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC trusted publishing — no npm token needed
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1. Pinned (not @latest): npm 12.0.0
      # (2026-07-08) regressed provenance signing — `Cannot find module 'sigstore'`.
      # 11.18.0 is the last version that published this package with provenance.
      - run: npm install -g npm@11.18.0

      - run: node --check bin/a11y-lens.mjs

      - run: npm publish
